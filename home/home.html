<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#CF102D">
<title>SwipeWise — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="home.css">
</head>
<body>
<div class="page">
  <div class="top"><div class="mark" aria-hidden="true">S</div><span class="name">SwipeWise</span></div>
  <h1 id="hello"></h1>
  <p class="sub" id="planline"></p>

  <section class="card">
    <p class="label">Meal swipes left</p>
    <div><span class="big" id="left">0</span><span class="of" id="of"></span></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <span class="pill" id="pill"></span>
    <p class="msg" id="msg"></p>
  </section>

  <div class="two">
    <section class="card"><p class="label">You can use</p><div class="num" id="allow">0</div><p class="note">swipes per day</p></section>
    <section class="card"><p class="label">Days left</p><div class="num" id="days">0</div><p class="note" id="endnote"></p></section>
  </div>

  <section class="card" style="margin-top:12px">
    <p class="label">Dining Dollars left</p>
    <div><span class="num" id="dd"></span><span class="of" id="ddof"></span></div>
    <div class="bar" style="margin-bottom:0"><div class="fill" id="ddfill"></div></div>
  </section>

  <section class="card">
    <p class="label">This week</p>
    <div class="week" id="week"></div>
  </section>

  <section class="card">
    <p class="label">Log a swipe</p>
    <div class="log"><select id="venue" aria-label="Venue"></select><button id="add" type="button">Log swipe</button></div>
  </section>

  <section class="card">
    <p class="label">Recent activity</p>
    <ul id="activity"></ul>
  </section>

  <p class="foot" id="foot">Sample data for design only. Balances will come from your database once the API is connected.</p>
</div>

<script src="home.js"></script>
</body>
</html>
