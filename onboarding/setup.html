<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#CF102D">
<title>SwipeWise — Set up your plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="setup.css">
</head>
<body>
<div class="page">
  <div class="top"><div class="mark" aria-hidden="true">S</div><span class="name">SwipeWise</span></div>
  <h1>Set up your plan</h1>
  <p class="sub">Enter what your meal plan portal shows right now. SwipeWise starts tracking from today, and you can update these numbers anytime.</p>

  <form class="card" id="form" novalidate>
    <div class="field">
      <label for="plan">Meal plan</label>
      <select id="plan" required><option value="">Choose your plan</option></select>
    </div>
    <p class="info hidden" id="info"></p>

    <div class="field" id="swipeWrap">
      <label for="swipes" id="swipeLabel">Meal swipes left</label>
      <input id="swipes" type="number" inputmode="numeric" min="0" step="1">
    </div>
    <div class="field">
      <label for="dollars">Dining Dollars left</label>
      <input id="dollars" type="number" inputmode="decimal" min="0" step="0.01">
    </div>
    <div class="field hidden" id="cashWrap">
      <label for="cash">Cardinal Cash left</label>
      <input id="cash" type="number" inputmode="decimal" min="0" step="0.01">
    </div>
    <div class="field hidden" id="guestWrap">
      <label for="guests">Guest passes left</label>
      <input id="guests" type="number" inputmode="numeric" min="0" step="1">
    </div>
    <!--<div class="field">
      <label for="end">Last day of the semester</label>
      <input id="end" type="date" required>
      <span class="help">Check the academic calendar. This sets how many days your balance has to last.</span>
    </div>-->

    <p class="err" id="err" role="alert"></p>
    <button class="go" type="submit">Save and continue</button>
  </form>

  <section class="card hidden" id="done">
    <h1 style="font-size:24px">You’re all set</h1>
    <p class="sub" style="margin-bottom:0">Here’s what SwipeWise will track.</p>
    <dl id="summary"></dl>
    <a class="go" href="home.html" style="display:block;text-align:center;text-decoration:none">Go to my home screen</a>
    <button class="alt" id="edit" type="button">Edit these numbers</button>
  </section>
</div>

<script src="setup.js"></script>
</body>
</html>
